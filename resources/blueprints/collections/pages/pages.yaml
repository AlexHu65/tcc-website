title: Page
tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: template
            field:
              type: template
              display: Template
              default: default
          -
            handle: hero_title
            field:
              type: text
              display: Hero title
          -
            handle: hero_subtitle
            field:
              type: textarea
              display: Hero subtitle
          -
            handle: content
            field:
              type: markdown
              display: Content
